name: Build and release

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        shell: pwsh
        env:
          DUAL_BOOT_SKIP_LIVE_BCD: "1"
        run: ./run-tests.ps1

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./tools/validate-release-version.ps1 -Tag $env:RELEASE_TAG

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build portable package
        shell: pwsh
        run: ./build.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualBootSwitcher-${{ github.sha }}
          path: |
            release/DualBootSwitcher.exe
            release/DualBootSwitcher-Setup.exe
            release/DualBootSwitcher-portable.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: DualBootSwitcher-${{ github.sha }}
          path: release

      - name: Prepare Chinese release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $content = Get-Content -Raw CHANGELOG.md
          $tag = [regex]::Escape($env:RELEASE_TAG)
          $match = [regex]::Match($content, "(?ms)^## $tag\s*\r?\n(.*?)(?=^## |\z)")
          if (-not $match.Success) {
            throw "CHANGELOG.md has no release notes for $env:RELEASE_TAG."
          }
          [System.IO.File]::WriteAllText("release-notes.md", $match.Groups[1].Value.Trim() + [Environment]::NewLine, [System.Text.UTF8Encoding]::new($false))

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            .\release\DualBootSwitcher-Setup.exe `
            .\release\DualBootSwitcher.exe `
            .\release\DualBootSwitcher-portable.zip `
            .\LICENSE `
            --verify-tag `
            --title "多系统切换 $env:GITHUB_REF_NAME" `
            --notes-file .\release-notes.md
